<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Salary</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #e0f2fe,
                #ede9fe,
                #cffafe
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .delete-card {
            width: 430px;
            padding: 35px;

            background: rgba(255, 255, 255, 0.78);
            backdrop-filter: blur(15px);

            border: 1px solid rgba(255, 255, 255, 0.7);
            border-radius: 22px;

            box-shadow:
                0 20px 45px rgba(80, 70, 150, 0.18);

            text-align: center;

            animation: cardShow 0.6s ease;
        }

        @keyframes cardShow {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.96);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 50%;

            background: linear-gradient(
                135deg,
                #dbeafe,
                #e9d5ff
            );

            font-size: 32px;

            box-shadow:
                0 8px 20px rgba(99, 102, 241, 0.15);
        }

        h1 {
            margin: 0 0 12px;

            color: #312e81;
            font-size: 27px;
        }

        .warning {
            color: #64748b;

            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 18px;
        }

        .employee {
            display: inline-block;

            padding: 11px 20px;
            margin-bottom: 27px;

            border-radius: 12px;

            background: rgba(224, 242, 254, 0.8);

            color: #0369a1;
            font-weight: bold;

            box-shadow:
                0 5px 15px rgba(14, 165, 233, 0.10);
        }

        .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        button,
        .cancel-btn {
            flex: 1;

            border: none;

            padding: 12px 20px;

            border-radius: 12px;

            font-size: 14px;
            font-weight: bold;

            cursor: pointer;

            text-decoration: none;
            text-align: center;

            transition: 0.3s ease;
        }

        .delete-btn {
            color: white;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            box-shadow:
                0 8px 18px rgba(99, 102, 241, 0.25);
        }

        .delete-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(99, 102, 241, 0.35);
        }

        .cancel-btn {
            color: #4338ca;

            background: white;

            border: 1px solid #c7d2fe;
        }

        .cancel-btn:hover {
            background: #eef2ff;
            transform: translateY(-3px);
        }

        @media (max-width: 500px) {
            .delete-card {
                width: 90%;
                padding: 28px 20px;
            }

            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="delete-card">

        <div class="icon">
            🗑️
        </div>

        <h1>Delete Salary Record?</h1>

        <p class="warning">
            Are you sure you want to delete the salary record of:
        </p>

        <div class="employee">
            {{ salary.employee }}
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="buttons">

                <button type="submit" class="delete-btn">
                    Yes, Delete
                </button>

                <a href="{% url 'salary_list' %}" class="cancel-btn">
                    Cancel
                </a>

            </div>
        </form>

    </div>

</body>

</html>
