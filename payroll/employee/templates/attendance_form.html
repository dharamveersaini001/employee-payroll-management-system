{% extends "base.html" %}

{% block title %}Add Attendance | PayFlow{% endblock %}

{% block content %}

<style>

    * {
        box-sizing: border-box;
    }

    /* MAIN CARD */

    .form-container {

        width: 100%;
        max-width: 850px;

        margin:auto;

        padding: 38px 42px;

        background: rgba(
            255,
            255,
            255,
            0.92
        );

        border: 1px solid rgba(
            255,
            255,
            255,
            0.9
        );

        border-radius: 24px;

        box-shadow:
            0 25px 60px rgba(
                71,
                85,
                105,
                0.14
            ),

            0 5px 20px rgba(
                99,
                102,
                241,
                0.06
            );

        animation: appear 0.6s ease;
    }


    /* ANIMATION */

    @keyframes appear {

        from {
            opacity: 0;
            transform: translateY(22px) scale(0.98);
        }

        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

    }


    /* TOP GRADIENT */

    .form-container::before {

        content: "";

        display: block;

        width: 100%;
        height: 5px;

        margin-bottom: 30px;

        border-radius: 20px;

        background:
            linear-gradient(
                90deg,
                #6366f1,
                #8b5cf6,
                #06b6d4
            );
    }


    /* HEADER */

    .header {

        display: flex;

        align-items: center;

        gap: 16px;

        margin-bottom: 30px;

        padding-bottom: 24px;

        border-bottom: 1px solid #e5eaf2;
    }


    /* ICON */

    .icon {

        width: 58px;
        height: 58px;

        display: flex;

        align-items: center;
        justify-content: center;

        flex-shrink: 0;

        border-radius: 17px;

        background:
            linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

        box-shadow:
            0 10px 25px rgba(
                99,
                102,
                241,
                0.25
            );
    }


    .icon svg {

        width: 30px;
        height: 30px;

        fill: white;
    }


    /* HEADER TEXT */

    .header-text h1 {

        font-size: 1.65rem;

        font-weight: 750;

        color: #1e2a4a;

        margin-bottom: 5px;
    }


    .header-text p {

        font-size: 0.92rem;

        color: #718096;
    }


    /* FORM */

    form {

        display: grid;

        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 20px 25px;
    }


    /* DJANGO FORM FIELDS */

    form p {

        margin: 0;

        padding: 16px;

        background:
            linear-gradient(
                145deg,
                #f9fbff,
                #f5f7ff
            );

        border: 1px solid #e2e8f2;

        border-radius: 15px;

        transition: all 0.25s ease;
    }


    form p:hover {

        background: #ffffff;

        border-color: #cbd5e5;

        box-shadow:
            0 8px 20px rgba(
                99,
                102,
                241,
                0.07
            );

        transform: translateY(-2px);
    }


    /* LABEL */

    form label {

        display: block;

        margin-bottom: 8px;

        font-size: 0.78rem;

        font-weight: 700;

        color: #53627a;

        letter-spacing: 0.4px;

        text-transform: uppercase;
    }


    /* INPUTS */

    form input[type="text"],
    form input[type="number"],
    form input[type="email"],
    form input[type="date"],
    form input[type="tel"],
    form select,
    form textarea {

        width: 100%;

        padding: 12px 14px;

        font-family: inherit;

        font-size: 0.95rem;

        color: #26324a;

        background: #ffffff;

        border: 1.5px solid #d8e0ec;

        border-radius: 10px;

        outline: none;

        transition: all 0.25s ease;
    }


    /* INPUT HOVER */

    form input:hover,
    form select:hover,
    form textarea:hover {

        border-color: #aebbd2;
    }


    /* INPUT FOCUS */

    form input:focus,
    form select:focus,
    form textarea:focus {

        border-color: #7c83f5;

        box-shadow:
            0 0 0 4px rgba(
                99,
                102,
                241,
                0.10
            );

        background: white;
    }


    /* ADD ATTENDANCE BUTTON */

    .attendance-btn {

        grid-column: 1 / -1;

        width: 100%;

        margin-top: 5px;

        padding: 14px 20px;

        display: flex;

        align-items: center;

        justify-content: center;

        gap: 8px;

        border: none;

        border-radius: 13px;

        font-family: inherit;

        font-size: 1rem;

        font-weight: 700;

        color: white;

        cursor: pointer;

        background:
            linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6,
                #06b6d4
            );

        background-size: 200% 200%;

        box-shadow:
            0 10px 25px rgba(
                99,
                102,
                241,
                0.25
            );

        transition:
            transform 0.3s ease,
            box-shadow 0.3s ease,
            background-position 0.3s ease;
    }


    /* BUTTON PLUS ICON */

    .attendance-btn span {

        font-size: 1.25rem;

        line-height: 1;
    }


    /* BUTTON HOVER */

    .attendance-btn:hover {

        background-position: 100% 50%;

        transform: translateY(-3px);

        box-shadow:
            0 15px 32px rgba(
                99,
                102,
                241,
                0.32
            );
    }


    /* BUTTON ACTIVE */

    .attendance-btn:active {

        transform: translateY(0);
    }


    /* BACK LINK */

    .back-link {

        display: inline-flex;

        align-items: center;

        gap: 8px;

        margin-top: 22px;

        color: #64748b;

        font-size: 0.9rem;

        font-weight: 600;

        text-decoration: none;

        transition: all 0.25s ease;
    }


    .back-link:hover {

        color: #6366f1;

        transform: translateX(-3px);
    }


    /* MOBILE */

    @media (max-width: 700px) {

        .form-container {

            margin: 20px auto;

            padding: 28px 20px;
        }


        form {

            grid-template-columns: 1fr;

            gap: 16px;
        }


        .header .icon {

            width: 50px;

            height: 50px;
        }


        .header-text h1 {

            font-size: 1.4rem;
        }

    }

</style>


<div class="form-container">


    <!-- HEADER -->

    <div class="header">

        <div class="icon">

            <svg viewBox="0 0 24 24">

                <path d="M19 3h-1V1h-2v2H8V1H6v2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 18H5V8h14v13zM7 10h5v5H7z"/>

            </svg>

        </div>


        <div class="header-text">

            <h1>Add Attendance</h1>

            <p>
                Enter attendance details for the employee
            </p>

        </div>

    </div>


    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}


        <button
            type="submit"
            class="attendance-btn"
        >

            <span>＋</span>

            Add Attendance

        </button>

    </form>


    <!-- BACK -->

    <a
        href="{% url 'attendance_list' %}"
        class="back-link"
    >

        ← Back to Attendance

    </a>


</div>

{% endblock %}
