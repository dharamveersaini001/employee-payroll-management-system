
{% extends "base.html" %}

{% block title %}Employees | PayFlow{% endblock %}

{% block content %}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            
            padding: 30px;

            font-family: 'Segoe UI', Arial, sans-serif;

            /* LIGHT GRADIENT */
            background:
                radial-gradient(circle at top left, #dbeafe 0%, transparent 38%),
                radial-gradient(circle at bottom right, #ede9fe 0%, transparent 38%),
                linear-gradient(135deg, #f8fbff, #eef4ff);

            color: #1e293b;
        }

        /* MAIN CARD */
        .form-container {
            width: 100%;
            max-width: 900px;
            margin:auto;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;

            padding: 38px 42px 32px;

            box-shadow:
                0 25px 60px rgba(71, 85, 105, 0.15),
                0 8px 25px rgba(99, 102, 241, 0.08);

            animation: cardAppear 0.7s ease forwards;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* TOP ACCENT */
        .form-container::before {
            content: "";
            display: block;
            height: 4px;
            width: 100%;
            margin-bottom: 30px;

            border-radius: 10px;

            background: linear-gradient(
                90deg,
                #6366f1,
                #8b5cf6,
                #06b6d4
            );
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            gap: 18px;

            padding-bottom: 25px;
            margin-bottom: 28px;

            border-bottom: 1px solid #e2e8f0;
        }

        .header .icon {
            width: 56px;
            height: 56px;

            flex-shrink: 0;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 16px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            box-shadow:
                0 10px 22px rgba(99, 102, 241, 0.25);
        }

        .header .icon svg {
            width: 28px;
            height: 28px;
            fill: white;
        }

        .header-text h1 {
            font-size: 1.65rem;
            font-weight: 700;
            color: #172554;

            margin-bottom: 5px;
        }

        .header-text p {
            font-size: 0.92rem;
            color: #64748b;
        }

        /* =========================
           HORIZONTAL FORM
        ========================== */

        form {
            display: grid;

            grid-template-columns: repeat(2, minmax(0, 1fr));

            column-gap: 25px;
            row-gap: 20px;
        }

        form p {
            margin: 0;
            width: 100%;
        }

        /* LABEL */
        form label {
            display: block;

            margin-bottom: 8px;

            font-size: 0.78rem;
            font-weight: 700;

            color: #475569;

            letter-spacing: 0.5px;
            text-transform: uppercase;

            transition: 0.25s ease;
        }

        form p:focus-within label {
            color: #6366f1;
        }

        /* INPUTS */
        form input[type="text"],
        form input[type="email"],
        form input[type="number"],
        form input[type="tel"],
        form input[type="date"],
        form input[type="password"],
        form select,
        form textarea {

            width: 100%;

            padding: 13px 15px;

            font-family: inherit;
            font-size: 0.95rem;

            color: #1e293b;

            background: #f8fafc;

            border: 1.5px solid #dbe3ef;
            border-radius: 12px;

            outline: none;

            transition:
                border-color 0.25s ease,
                background 0.25s ease,
                box-shadow 0.25s ease,
                transform 0.25s ease;
        }

        /* INPUT HOVER */
        form input:hover,
        form select:hover,
        form textarea:hover {
            border-color: #b8c5d9;
            background: #ffffff;
        }

        /* INPUT FOCUS */
        form input:focus,
        form select:focus,
        form textarea:focus {

            background: #ffffff;

            border-color: #818cf8;

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, 0.10),
                0 8px 20px rgba(99, 102, 241, 0.08);

            transform: translateY(-1px);
        }

        form input::placeholder {
            color: #94a3b8;
        }

        /* DATE INPUT */
        input[type="date"] {
            cursor: pointer;
        }

        /* ERROR */
        .errorlist {
            list-style: none;

            margin-top: 7px;
            padding: 0;
        }

        .errorlist li {
            padding: 6px 10px;

            font-size: 0.78rem;

            color: #dc2626;

            background: #fef2f2;

            border-left: 3px solid #ef4444;

            border-radius: 7px;
        }

        /* =========================
           BUTTON
        ========================== */

        form button[type="submit"] {

            grid-column: 1 / -1;

            width: 100%;

            margin-top: 8px;

            padding: 14px 20px;

            border: none;
            border-radius: 13px;

            cursor: pointer;

            font-family: inherit;
            font-size: 1rem;
            font-weight: 700;

            color: white;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6,
                    #06b6d4
                );

            background-size: 200% 200%;

            box-shadow:
                0 10px 25px rgba(99, 102, 241, 0.25);

            transition: all 0.3s ease;
        }

        form button[type="submit"]:hover {

            background-position: right center;

            transform: translateY(-2px);

            box-shadow:
                0 14px 30px rgba(99, 102, 241, 0.30);
        }

        form button[type="submit"]:active {
            transform: translateY(0);
        }

        /* BACK LINK */
        .back-link {

            display: inline-flex;
            align-items: center;
            gap: 8px;

            margin-top: 22px;

            color: #64748b;

            font-size: 0.9rem;
            font-weight: 600;

            text-decoration: none;

            transition: all 0.25s ease;
        }

        .back-link:hover {
            color: #6366f1;
            transform: translateX(-3px);
        }

        .back-link svg {
            width: 17px;
            height: 17px;
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 700px) {

            body {
                padding: 15px;
            }

            .form-container {
                padding: 28px 22px 25px;
            }

            form {
                grid-template-columns: 1fr;
                gap: 17px;
            }

            .header {
                gap: 13px;
            }

            .header .icon {
                width: 48px;
                height: 48px;
            }

            .header-text h1 {
                font-size: 1.35rem;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="header">

            <div class="icon">
                <svg viewBox="0 0 24 24"
                     xmlns="http://www.w3.org/2000/svg">

                    <path d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm-9-2V7H4v3H1v2h3v3h2v-3h3v-2H6zm9 4c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>

                </svg>
            </div>

            <div class="header-text">

                <h1>Add New Employee</h1>

                <p>
                    Enter the required details to add a new team member
                </p>

            </div>

        </div>


        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save Employee
            </button>

        </form>


        <a href="{% url 'employee_list' %}" class="back-link">

            <svg viewBox="0 0 24 24" fill="currentColor">

                <path d="M20 11H7.83l5.59-5.59L12 4l8 8-8 8 1.41 1.41L7.83 13H20v-2z"/>

            </svg>

            Back to Employees

        </a>

    </div>

</body>
</html>
{%endblock%}
