<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Payroll System{% endblock %}</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            min-height: 100vh;

            background:
                radial-gradient(
                    circle at 10% 10%,
                    rgba(115, 196, 255, 0.25),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 90% 15%,
                    rgba(177, 132, 255, 0.22),
                    transparent 30%
                ),
                linear-gradient(
                    135deg,
                    #eef8ff,
                    #f5f0ff,
                    #eafaff
                );

            color: #26324a;
        }


        /* NAVBAR */

        .navbar {
            width: 94%;
            max-width: 1250px;

            margin: 22px auto;

            padding: 15px 22px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;

            border-radius: 20px;

            background: rgba(255,255,255,0.70);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255,255,255,0.85);

            box-shadow:
                0 15px 40px rgba(80,110,160,0.14);

            animation: navIn .7s ease;
        }


        .logo {
            text-decoration: none;

            font-size: 23px;
            font-weight: 800;

            background:
                linear-gradient(
                    90deg,
                    #358eea,
                    #8066df,
                    #16bfc8
                );

            -webkit-background-clip: text;
            color: transparent;

            white-space: nowrap;
        }


        .nav-links {
            display: flex;
            align-items: center;

            gap: 7px;

            flex-wrap: wrap;
            justify-content: center;
        }


        .nav-links a {
            text-decoration: none;

            color: #53627d;

            font-size: 13px;
            font-weight: 700;

            padding: 10px 13px;

            border-radius: 12px;

            transition: .3s ease;
        }


        .nav-links a:hover {
            color: #426ac4;

            background:
                linear-gradient(
                    135deg,
                    #e2f6ff,
                    #eee5ff
                );

            transform: translateY(-2px);
        }


        .add-btn {
            text-decoration: none;

            padding: 11px 17px;

            border-radius: 12px;

            color: white !important;

            background:
                linear-gradient(
                    90deg,
                    #4e9eea,
                    #8067dc
                );

            box-shadow:
                0 8px 20px rgba(90,110,210,.20);

            transition: .3s ease;
        }


        .add-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 12px 25px rgba(80,120,210,.30);
        }


        .page-container {
            width: 94%;
            max-width: 1250px;

            margin: 0 auto 40px;
        }


        @keyframes navIn {

            from {
                opacity: 0;
                transform: translateY(-20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        @media (max-width: 900px) {

            .navbar {
                flex-direction: column;
            }

        }


        @media (max-width: 600px) {

            .nav-links {
                gap: 3px;
            }

            .nav-links a {
                font-size: 12px;
                padding: 8px 9px;
            }

        }
    </style>

    {% block extra_css %}{% endblock %}

</head>

<body>


    <nav class="navbar">

        <a href="{% url 'dashboard' %}" class="logo">
            PayFlow
        </a>


        <div class="nav-links">

            <a href="{% url 'dashboard' %}">
                🏠 Dashboard
            </a>

            <a href="{% url 'employee_list' %}">
                👥 Employees
            </a>

            <a href="{% url 'attendance_list' %}">
                📅 Attendance
            </a>

            <a href="{% url 'bank_list' %}">
                🏦 Bank
            </a>

            <a href="{% url 'salary_list' %}">
                💰 Salary
            </a>

        </div>


        <a href="{% url 'employee_add' %}" class="add-btn">
            + Employee
        </a>

    </nav>


    <main class="page-container">

        {% block content %}
        {% endblock %}

    </main>


</body>
</html>
