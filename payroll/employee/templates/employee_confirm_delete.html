
<!DOCTYPE html>
<html>

<head>

    <title>Delete Employee</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            font-family: "Segoe UI", Arial, sans-serif;

            color: #26324a;

            background:
                radial-gradient(
                    circle at top left,
                    #dbeafe 0%,
                    transparent 35%
                ),

                radial-gradient(
                    circle at bottom right,
                    #ede9fe 0%,
                    transparent 35%
                ),

                linear-gradient(
                    135deg,
                    #f8fbff,
                    #f1f5ff
                );
        }

        /* DELETE CARD */

        .delete-card {

            width: 100%;
            max-width: 480px;

            padding: 40px;

            text-align: center;

            background: rgba(
                255,
                255,
                255,
                0.92
            );

            border: 1px solid rgba(
                255,
                255,
                255,
                0.9
            );

            border-radius: 24px;

            box-shadow:
                0 25px 60px rgba(
                    71,
                    85,
                    105,
                    0.14
                ),

                0 5px 20px rgba(
                    99,
                    102,
                    241,
                    0.06
                );

            animation: appear 0.6s ease;
        }

        @keyframes appear {

            from {
                opacity: 0;
                transform: translateY(25px) scale(0.97);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        /* TOP GRADIENT */

        .delete-card::before {

            content: "";

            display: block;

            width: 100%;
            height: 5px;

            margin-bottom: 30px;

            border-radius: 20px;

            background:
                linear-gradient(
                    90deg,
                    #6366f1,
                    #8b5cf6,
                    #06b6d4
                );
        }

        /* ICON */

        .icon {

            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 20px;

            color: #dc2626;

            background:
                linear-gradient(
                    145deg,
                    #fff1f2,
                    #ffe4e6
                );

            border: 1px solid #fecdd3;

            box-shadow:
                0 10px 25px rgba(
                    239,
                    68,
                    68,
                    0.10
                );
        }

        .icon svg {

            width: 32px;
            height: 32px;

            fill: currentColor;
        }

        /* HEADING */

        h2 {

            margin-bottom: 12px;

            font-size: 1.7rem;

            font-weight: 750;

            color: #1e2a4a;
        }

        /* MESSAGE */

        p {

            margin-bottom: 28px;

            font-size: 0.98rem;

            line-height: 1.7;

            color: #64748b;
        }

        strong {

            color: #334155;

            font-weight: 700;
        }

        /* BUTTON AREA */

        form {

            display: flex;

            justify-content: center;

            gap: 12px;

            margin-bottom: 12px;
        }

        /* DELETE BUTTON */

        button {

            padding: 12px 22px;

            border: none;

            border-radius: 11px;

            font-family: inherit;

            font-size: 0.92rem;

            font-weight: 700;

            color: white;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #ef4444,
                    #dc2626
                );

            box-shadow:
                0 8px 20px rgba(
                    239,
                    68,
                    68,
                    0.22
                );

            transition: all 0.25s ease;
        }

        button:hover {

            transform: translateY(-2px);

            box-shadow:
                0 12px 25px rgba(
                    239,
                    68,
                    68,
                    0.30
                );
        }

        button:active {

            transform: translateY(0);
        }

        /* CANCEL */

        a {

            display: inline-block;

            padding: 11px 22px;

            color: #6366f1;

            background: #eef2ff;

            border: 1px solid #dbe2ff;

            border-radius: 11px;

            text-decoration: none;

            font-size: 0.92rem;

            font-weight: 700;

            transition: all 0.25s ease;
        }

        a:hover {

            color: white;

            background: #6366f1;

            transform: translateY(-2px);
        }

        /* MOBILE */

        @media (max-width: 500px) {

            .delete-card {

                padding: 30px 22px;
            }

            h2 {

                font-size: 1.45rem;
            }

            form {

                flex-direction: column;
            }

            button,
            a {

                width: 100%;
            }
        }

    </style>

</head>

<body>


<div class="delete-card">

    <div class="icon">

        <svg viewBox="0 0 24 24">

            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM8 9h8v10H8V9zm7.5-5l-1-1h-5l-1 1H5v2h14V4z"/>

        </svg>

    </div>


    <h2>Delete Employee</h2>


    <p>
        Are you sure you want to delete
        <strong>{{ employee.name }}</strong>?
    </p>


    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete
        </button>

    </form>


    <a href="{% url 'employee_list' %}">
        Cancel
    </a>

</div>


</body>

</html>
