{% extends "base.html" %}

{% block title %}Employees | PayFlow{% endblock %}

{% block content %}
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(circle at top left, #dff6ff, transparent 40%),
                radial-gradient(circle at bottom right, #e9ddff, transparent 40%),
                linear-gradient(135deg, #eefaff, #f5efff);

            padding: 40px 20px;
        }

        .form-container {
            width: 100%;
            max-width: 850px;
            margin:auto;
            background: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(14px);

            padding: 40px;
            border-radius: 24px;

            box-shadow:
                0 20px 50px rgba(93, 76, 150, 0.15),
                0 8px 25px rgba(0, 190, 220, 0.08);

            position: relative;
            overflow: hidden;

            animation: cardAppear 0.7s ease;
        }

        .form-container::before {
            content: "";
            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background: linear-gradient(
                90deg,
                #55d9ff,
                #8f7cff,
                #c18cff
            );
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .icon {
            width: 65px;
            height: 65px;

            margin: 0 auto 15px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 18px;

            background: linear-gradient(
                135deg,
                #d9f7ff,
                #e9ddff
            );

            font-size: 30px;

            box-shadow:
                0 8px 20px rgba(113, 98, 216, 0.15);
        }

        h1 {
            margin: 0;

            font-size: 30px;
            color: #38345c;
            font-weight: 700;
        }

        .subtitle {
            margin-top: 8px;

            color: #77758d;
            font-size: 14px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
        }

        form p {
            margin: 0;
            padding: 15px;

            background: linear-gradient(
                135deg,
                rgba(235, 250, 255, 0.9),
                rgba(246, 239, 255, 0.9)
            );

            border: 1px solid rgba(135, 125, 220, 0.12);

            border-radius: 14px;

            transition: 0.3s ease;
        }

        form p:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(108, 92, 180, 0.08);
        }

        form p label {
            display: block;

            margin-bottom: 8px;

            color: #504b78;

            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 12px 14px;

            border: 1px solid #d8d6e8;

            border-radius: 10px;

            background: rgba(255, 255, 255, 0.9);

            color: #393650;

            font-size: 14px;

            outline: none;

            transition: 0.3s ease;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #8c7cff;

            box-shadow:
                0 0 0 4px rgba(140, 124, 255, 0.12);

            background: white;
        }

        input:hover,
        select:hover,
        textarea:hover {
            border-color: #9ddff0;
        }

        .errorlist {
            margin: 5px 0;
            padding: 0;

            list-style: none;

            color: #e05a6f;

            font-size: 12px;
        }

        button {
            grid-column: 1 / -1;

            width: 100%;

            margin-top: 10px;

            padding: 14px;

            border: none;
            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #62d9f5,
                #8b7cff,
                #b57cff
            );

            color: white;

            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 10px 25px rgba(111, 102, 220, 0.22);

            transition: 0.3s ease;
        }

        button:hover {
            transform: translateY(-3px);

            box-shadow:
                0 15px 30px rgba(111, 102, 220, 0.30);
        }

        .back-link {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #6d63c9;

            text-decoration: none;

            font-size: 14px;
            font-weight: 600;

            transition: 0.3s ease;
        }

        .back-link:hover {
            color: #3bb8d8;
        }

        @keyframes cardAppear {
            from {
                opacity: 0;
                transform: translateY(25px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @media (max-width: 650px) {

            .form-container {
                padding: 25px 20px;
            }

            form {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>

    <div class="form-container">

        <div class="header">

            <div class="icon">
                💰
            </div>

            <h1>Add Salary</h1>

            <div class="subtitle">
                Enter employee salary information
            </div>

        </div>

        <form method="POST">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Save Salary
            </button>

        </form>

        <a href="{% url 'salary_list' %}" class="back-link">
            ← Back to Salary Details
        </a>

    </div>

</body>

</html>
{%endblock%}
